# Configuração de deploy na Netlify.
#
# O Next.js Runtime v5 da Netlify cuida do App Router, das rotas dinâmicas
# (icon, opengraph-image, sitemap, robots) e roteia o next/image para o
# Netlify Image CDN. A Netlify instala o plugin sozinha ao detectar o Next.js;
# declarar aqui só deixa explícito e garante que a build não dependa da
# detecção automática.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Fixa a major do Node para a build ser reproduzível entre a sua máquina e a CI.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache imutável para os assets com hash gerados pelo Next (JS, CSS, fontes e
# as imagens importadas estaticamente de assets/). O nome de cada arquivo muda
# quando o conteúdo muda, então nunca serve conteúdo velho.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeçalhos de segurança. O Lighthouse (Best Practices) e o Mozilla Observatory
# olham para estes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
